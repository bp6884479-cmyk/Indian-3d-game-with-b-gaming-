name: Build IndianCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup project
        run: |
          ls -la
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f "Indian-3d-game-with-b-gaming-/index.html" ]; then cp "Indian-3d-game-with-b-gaming-/index.html" www/index.html; fi
          ls -la www || ls -la

      - name: Create Capacitor config
        run: |
          echo '{"appId":"com.indiancraft.game","appName":"IndianCraft","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json
          npx cap add android || true
          npx cap sync android || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndianCraft-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
