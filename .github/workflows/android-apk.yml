name: Build IndianCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup project
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/browser
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; cp -r *.js www/ 2>/dev/null || true; cp -r *.css www/ 2>/dev/null || true; cp -r assets www/ 2>/dev/null || true; fi
          if [ -d "Indian-3d-game-with-b-gaming-" ]; then cp -r "Indian-3d-game-with-b-gaming-/"* www/ 2>/dev/null || true; fi

      - name: Create Capacitor config with Google fix
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.indiancraft.game",
            "appName": "IndianCraft",
            "webDir": "www",
            "server": {
              "allowNavigation": ["*.google.com", "*.googleapis.com", "*.firebaseapp.com", "*.firebaseio.com", "accounts.google.com"],
              "cleartext": true
            },
            "plugins": {
              "Browser": {}
            }
          }
          EOF
          npx cap add android || true
          npx cap sync android || true

      - name: Fix Android Manifest
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndianCraft-Android-APK-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
