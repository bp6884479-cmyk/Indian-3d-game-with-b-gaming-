name: Build IndianCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  ADMOB_APP_ID: ca-app-pub-7956447630438100~9662953701

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/browser@7 @capacitor-community/admob@7 @capacitor/assets

          mkdir -p www

          if [ -f index.html ]; then
            rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='android' \
              --exclude='node_modules' \
              --exclude='www' \
              --exclude='package.json' \
              --exclude='package-lock.json' \
              --exclude='icon-512.png' \
              ./ www/
          elif [ -f "Indian-3d-game-with-b-gaming-/index.html" ]; then
            rsync -av \
              --exclude='icon-512.png' \
              "Indian-3d-game-with-b-gaming-/" www/
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

      - name: Prepare app icon
        run: |
          python3 -m pip install --user Pillow

          mkdir -p assets

          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os

          source = "icon-512.png"

          if not os.path.isfile(source):
              raise SystemExit("ERROR: icon-512.png missing from repository root")

          image = Image.open(source).convert("RGBA")
          image = ImageOps.fit(image, (1024, 1024))

          os.makedirs("assets", exist_ok=True)
          image.save("assets/icon.png", optimize=True)

          splash = Image.new("RGB", (2732, 2732), "#17202a")
          logo = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          splash.paste(logo, (854, 854), logo)
          splash.save("assets/splash.png", optimize=True)

          print("App icon and splash image prepared.")
          PY

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.indiancraft.game",
            "appName": "IndianCraft",
            "webDir": "www",
            "server": {
              "cleartext": true,
              "allowNavigation": [
                "*.google.com",
                "*.googleapis.com",
                "*.firebaseapp.com",
                "*.firebaseio.com"
              ]
            },
            "plugins": {
              "Browser": {}
            }
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher icons
        run: |
          npx capacitor-assets generate --android

      - name: Fix Android Manifest and add AdMob App ID
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          tag = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % os.environ['ADMOB_APP_ID']
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>', '    ' + tag + '\n    </application>')
          open(p, 'w', encoding='utf-8').write(s)
          print('Manifest updated')
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndianCraft-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
